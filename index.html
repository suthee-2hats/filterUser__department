<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Search</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="user-search-page">

        <section class="user-search">
            <h1 class="user-search__title">
                Search User
            </h1>

            <div class="user-search__form">
                <input
                    type="text"
                    class="user-search__input"
                    placeholder="Enter username..."
                >

                <button class="user-search__btn">
                    Search
                </button>
            </div>
        </section>

        <!-- Search Result -->
        <section class="user-result">
            <!-- User card will be inserted here using JavaScript -->

            <!-- Example Structure -->
            
            <div class="user-card">
                
            </div>
        
        </section>

        <section class="filter__user">

          <div class="department__filter">


          </div>
          <div class="User__details">
           
          </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
